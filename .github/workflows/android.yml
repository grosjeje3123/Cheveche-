# Compile Chevêche pour Android (AAB pour Google Play) à chaque envoi sur main.
# Les secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD (et, au besoin, ANDROID_KEYSTORE_ALIAS)
# servent à signer l'AAB avec la clé de publication. Sans eux, l'AAB est signé avec une clé de test.
name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]   # la page de confidentialité et le README ne changent pas l'AAB
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"
  GRADLE_VERSION: "8.2"   # celle du modèle Android de Godot 4.4.1 (android/build/gradle/wrapper)

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot et modèles d'export
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q templates.tpz && mv templates/* "$dest/" && rm -rf templates templates.tpz

      - name: Préparer
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p journal build
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;36.0.0" > /dev/null
          keytool -genkeypair -noprompt -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          major_minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-${major_minor}.tres"

      - name: Tests du jeu
        timeout-minutes: 25
        run: |
          pip install --quiet pillow
          bash tests/run_all.sh "$GODOT" 2>&1 | tee journal/tests.txt

      # Gradle lui-même (le zip de 120 Mo que le wrapper télécharge) : téléchargé une fois avec des reprises,
      # puis gardé d'un run à l'autre. Le serveur de Gradle répond parfois 504 ou ne répond plus.
      - name: Gradle mis de côté
        id: cache-gradle-zip
        uses: actions/cache/restore@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ env.GRADLE_VERSION }}

      - name: Télécharger Gradle
        if: steps.cache-gradle-zip.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          mkdir -p ~/gradle-dist
          zip=~/gradle-dist/gradle-${GRADLE_VERSION}-bin.zip
          for url in "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                     "https://github.com/gradle/gradle-distributions/releases/download/v${GRADLE_VERSION}.0/gradle-${GRADLE_VERSION}-bin.zip"; do
            curl -fL --retry 6 --retry-all-errors --retry-delay 20 --connect-timeout 30 --max-time 900 -o "$zip" "$url" && break
          done
          unzip -tq "$zip"

      - name: Garder Gradle pour les prochains runs
        if: steps.cache-gradle-zip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ env.GRADLE_VERSION }}

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/android_template.sh') }}
          restore-keys: gradle-${{ env.GODOT_VERSION }}-

      - name: Exporter l'AAB
        timeout-minutes: 40
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Un copier-coller (surtout depuis un téléphone) ajoute parfois des espaces ou des retours à la ligne.
            KEYSTORE_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
            KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            KEYSTORE_ALIAS=$(printf '%s' "$KEYSTORE_ALIAS" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/upload.jks" || true
            # Contrôle de la clé, sans rien dévoiler : taille, début de l'empreinte, longueurs, réponse de keytool.
            {
              echo "Clé : $(stat -c %s "$HOME/upload.jks") octets, empreinte $(sha256sum "$HOME/upload.jks" | cut -c1-16), texte de ${#KEYSTORE_B64} caractères"
              echo "Mot de passe : ${#KEYSTORE_PASSWORD} caractères ; alias : ${KEYSTORE_ALIAS:-cheveche}"
              keytool -list -keystore "$HOME/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEYSTORE_ALIAS:-cheveche}" 2>&1 \
                | grep -v JAVA_TOOL | head -3 || true
            } > journal/cle.txt
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/upload.jks"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="${KEYSTORE_ALIAS:-cheveche}"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASSWORD"
            mode=--export-release
            echo "Signature : clé de publication" | tee journal/export.txt
          else
            mode=--export-debug
            echo "Pas de clé de publication dans les secrets : AAB signé avec une clé de test, non publiable" | tee journal/export.txt
          fi
          # Le modèle Gradle est installé à la main, pour vider l'écran de démarrage d'Android (papier ivoire, sans icône).
          bash tools/android_template.sh "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
               "$HOME/gradle-dist/gradle-${GRADLE_VERSION}-bin.zip" 2>&1 | tee -a journal/export.txt
          timeout 2100 "$GODOT" --headless --path . $mode "Android AAB" "$PWD/build/cheveche.aab" 2>&1 | tee -a journal/export.txt
          grep -E "androidGradlePlugin|compileSdk|targetSdk|buildTools" android/build/config.gradle > journal/gradle.txt || true
          ls -la build/ | tee -a journal/export.txt
          test -s build/cheveche.aab

      - name: AAB à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: cheveche-aab
          path: build/cheveche.aab
          if-no-files-found: error

      # Après l'envoi de l'AAB : si GitHub ne sert pas bundletool, l'AAB reste téléchargeable.
      - name: Vérifier l'AAB
        timeout-minutes: 15
        continue-on-error: true
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 --connect-timeout 30 -o "$HOME/bundletool.jar" \
               https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar 2>&1 | tee journal/bundletool.txt
          java -jar "$HOME/bundletool.jar" dump manifest --bundle build/cheveche.aab > journal/manifest.xml
          grep -oE '(package|android:versionCode|android:versionName|android:minSdkVersion|android:targetSdkVersion)="[^"]+"' journal/manifest.xml | tee journal/resume.txt
          ls -la build/cheveche.aab | tee -a journal/resume.txt
          java -jar "$HOME/bundletool.jar" dump resources --bundle build/cheveche.aab --resource style/GodotAppSplashTheme --values >> journal/resume.txt 2>&1 || true

      # Journal lisible sans connexion : poussé sur la branche journal-ci.
      - name: Journal
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/journal && cp -r journal/. /tmp/journal/ 2>/dev/null || true
          echo "run ${{ github.run_number }} : ${{ job.status }} ($(date -u +%FT%TZ), commit ${GITHUB_SHA::7})" > /tmp/journal/etat.txt
          cd /tmp/journal && git init -q && git checkout -q -b journal-ci && git add -A
          git -c user.name="CI Chevêche" -c user.email="ci@users.noreply.github.com" commit -qm "Journal du run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" journal-ci
